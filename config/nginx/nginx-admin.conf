# ─────────────────────────────────────────────────────────────────────────────
# nginx reverse proxy for admin/observability tooling.
#
# Exposes:
#   :8080  → Grafana  (http://grafana:3000)
#   :8081  → Kibana   (http://kibana:5601)
#
# Both endpoints are protected by HTTP Basic Auth.
# Credentials are stored in /etc/nginx/conf.d/.htpasswd (mounted at runtime).
#
# X-Frame-Options is intentionally omitted so the React admin dashboard
# can embed Grafana and Kibana in iframes.
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 512;
}

http {
    # ── Grafana ───────────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        location / {
            auth_basic           "DevOps Suite — Admin Access Required";
            auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

            proxy_pass         http://grafana:3000;
            proxy_http_version 1.1;

            # WebSocket support (Grafana Live)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Remove X-Frame-Options from upstream so our iframe works
            proxy_hide_header X-Frame-Options;

            # Allow framing from localhost (React dev + Docker)
            add_header Content-Security-Policy "frame-ancestors 'self' http://localhost http://localhost:80 http://localhost:5173" always;

            proxy_read_timeout 90s;
        }
    }

    # ── Kibana ────────────────────────────────────────────────────────────────
    server {
        listen 8081;
        server_name _;

        location / {
            auth_basic           "DevOps Suite — Admin Access Required";
            auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

            proxy_pass         http://kibana:5601;
            proxy_http_version 1.1;

            # WebSocket support (Kibana real-time features)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Kibana needs kbn-xsrf passthrough
            proxy_set_header kbn-xsrf "";

            # Remove X-Frame-Options from upstream so our iframe works
            proxy_hide_header X-Frame-Options;

            # Allow framing from localhost
            add_header Content-Security-Policy "frame-ancestors 'self' http://localhost http://localhost:80 http://localhost:5173" always;

            proxy_read_timeout 90s;
        }
    }
}
