server.host: "0.0.0.0"
elasticsearch.hosts: ["http://elasticsearch:9200"]

# Disable telemetry and news feed
telemetry.enabled: false
newsfeed.enabled: false

# Logging
logging.root.level: warn

# Note: X-Frame-Options removal and Content-Security-Policy frame-ancestors
# are already handled upstream by admin-proxy (config/nginx/nginx-admin.conf).
# (server.securityResponseHeaders.xframe is deprecated/unsupported in Kibana 8.x)

server.publicBaseUrl: "http://localhost:8083"

# Note: In Kibana 8.x, xpack plugin features (maps, ml, fleet, etc.) cannot be
# disabled via kibana.yml — those config keys were removed. The free Basic license
# includes these plugins and they are safe to leave enabled; they simply won't be
# used. Attempting to set xpack.<plugin>.enabled: false causes a fatal config
# validation error and prevents Kibana from starting.
