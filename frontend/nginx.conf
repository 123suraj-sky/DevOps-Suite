server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA: fall back to index.html for client-side routing ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── REST API proxy → Spring Boot backend ──
    # NOTE: trailing slash on both sides so /api/auth/login → backend:8081/api/auth/login
    location /api/ {
        proxy_pass         http://backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket proxy → Spring Boot STOMP/SockJS endpoint ──
    # SockJS uses HTTP long-polling at /ws/info before upgrading — both are handled here
    location /ws/ {
        proxy_pass         http://backend:8081/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Gzip compression ──
    gzip            on;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ──
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
}
