<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Hex fill: dark background -->
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a103d"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>

    <!-- Accent gradient: violet → cyan, used for stroke and shapes -->
    <linearGradient id="accent" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Play triangle fill -->
    <linearGradient id="play" x1="40" y1="33" x2="72" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Hexagon background -->
  <polygon
    points="50,4 94,27 94,73 50,96 6,73 6,27"
    fill="url(#bg)"
  />

  <!-- Hexagon border -->
  <polygon
    points="50,4 94,27 94,73 50,96 6,73 6,27"
    stroke="url(#accent)"
    stroke-width="3"
  />

  <!-- Subtle inner hex ring -->
  <polygon
    points="50,14 84,32 84,68 50,86 16,68 16,32"
    stroke="url(#accent)"
    stroke-width="0.75"
    opacity="0.25"
  />

  <!-- Play triangle -->
  <polygon
    points="43,32 43,68 73,50"
    fill="url(#play)"
  />

  <!-- Small circular dot on the play tip — adds a pipeline/node feel -->
  <circle cx="73" cy="50" r="3.5" fill="#22d3ee"/>

  <!-- Two short horizontal lines top-left — suggest code/terminal lines -->
  <line x1="15" y1="38" x2="28" y2="38" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="15" y1="44" x2="23" y2="44" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Two short lines bottom-right — mirror balance -->
  <line x1="72" y1="62" x2="85" y2="62" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="77" y1="68" x2="85" y2="68" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
