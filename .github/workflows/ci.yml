name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Job 1: Build & test Spring Boot backend ──────────────────────────────────
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run backend tests
        run: |
          cd backend
          mvn clean test

  # ── Job 2: Build React frontend ───────────────────────────────────────────────
  build-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build for production
        run: |
          cd frontend
          npm run build

  # ── Job 3: Deploy to Azure VM ─────────────────────────────────────────────────
  # Runs only on push to main (not on PRs) and only after both build jobs pass
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            cd /home/sky/DevOps-Suite

            echo "→ Pulling latest code..."
            git pull origin main

            echo "→ Rebuilding changed images..."
            docker compose build frontend backend

            echo "→ Bringing stack up..."
            docker compose up -d --remove-orphans

            echo "→ Cleaning up unused images..."
            docker image prune -f

            echo "✅ Deploy complete!"
