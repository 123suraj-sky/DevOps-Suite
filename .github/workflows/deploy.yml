name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Tests
        run: |
          cd backend
          mvn clean test

  build-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          CYPRESS_INSTALL_BINARY=0 npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  deploy:
    name: Deploy to Azure VM
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: SSH Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            if [ -d "$HOME/DevOps-Suite" ]; then
              cd "$HOME/DevOps-Suite"
            elif [ -d "$HOME/devops-suite" ]; then
              cd "$HOME/devops-suite"
            else
              echo "Repository directory not found!"
              exit 1
            fi
            
            git pull origin master
            docker system prune -af --volumes=false
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache backend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache frontend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
