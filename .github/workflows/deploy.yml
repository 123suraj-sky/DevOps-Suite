name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Tests
        run: |
          cd backend
          mvn clean test

  build-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          CYPRESS_INSTALL_BINARY=0 npm install --legacy-peer-deps

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # PUBLISH JOBS
  # Publish only after both test jobs pass on master pushes or manual runs.
  # Both images are published in parallel.
  # Docker requires image names to be lowercase, so we derive them from
  # a lowercased github.repository value set in a step.
  # ---------------------------------------------------------------------------

  publish-backend:
    name: Publish Backend Image
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Keep the 3 newest successfully published frontend image versions.
      # GHCR also contains untagged attestation/provenance versions, so
      # only tagged container versions are counted as releases. Everything
      # older than the 3rd newest tagged release is removed, including
      # old untagged artifacts.
      - name: Keep only last 3 successful frontend releases
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PACKAGE_NAME="$(echo "${REPO}-frontend" | tr '[:upper:]' '[:lower:]')"
          OWNER_TYPE="${{ github.event.repository.owner.type }}"

          if [ "$OWNER_TYPE" = "Organization" ]; then
            API_PATH="/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
          else
            API_PATH="/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
          fi

          VERSIONS="$(gh api --paginate --slurp "$API_PATH?per_page=100" --jq 'add')"

          TAGGED="$(echo "$VERSIONS" | jq -c '
            map(select((.metadata.container.tags // []) | length > 0))
            | sort_by(.created_at)
            | reverse
          ')"

          TAGGED_COUNT="$(echo "$TAGGED" | jq 'length')"

          if [ "$TAGGED_COUNT" -le 3 ]; then
            echo "Only ${TAGGED_COUNT} tagged frontend release(s) exist. Nothing to delete."
            exit 0
          fi

          CUTOFF="$(echo "$TAGGED" | jq -r '.[2].created_at')"

          echo "Keeping the 3 newest tagged frontend releases."
          echo "Retention cutoff: ${CUTOFF}"

          echo "$VERSIONS" | jq -r --arg cutoff "$CUTOFF" '
            .[]
            | select(.created_at < $cutoff)
            | [.id, .created_at, ((.metadata.container.tags // []) | join(","))]
            | @tsv
          ' |
          while IFS=$'\t' read -r VERSION_ID CREATED_AT TAGS; do
            echo "Deleting frontend package version ${VERSION_ID} (${CREATED_AT}) tags=[${TAGS}]"
            gh api --method DELETE "$API_PATH/$VERSION_ID"
          done

      # Keep the 3 newest successfully published backend image versions.
      # GHCR also contains untagged attestation/provenance versions, so
      # only tagged container versions are counted as releases. Everything
      # older than the 3rd newest tagged release is removed, including
      # old untagged artifacts.
      - name: Keep only last 3 successful backend releases
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PACKAGE_NAME="$(echo "${REPO}-backend" | tr '[:upper:]' '[:lower:]')"
          OWNER_TYPE="${{ github.event.repository.owner.type }}"

          if [ "$OWNER_TYPE" = "Organization" ]; then
            API_PATH="/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
          else
            API_PATH="/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
          fi

          VERSIONS="$(gh api --paginate --slurp "$API_PATH?per_page=100" --jq 'add')"

          TAGGED="$(echo "$VERSIONS" | jq -c '
            map(select((.metadata.container.tags // []) | length > 0))
            | sort_by(.created_at)
            | reverse
          ')"

          TAGGED_COUNT="$(echo "$TAGGED" | jq 'length')"

          if [ "$TAGGED_COUNT" -le 3 ]; then
            echo "Only ${TAGGED_COUNT} tagged backend release(s) exist. Nothing to delete."
            exit 0
          fi

          CUTOFF="$(echo "$TAGGED" | jq -r '.[2].created_at')"

          echo "Keeping the 3 newest tagged backend releases."
          echo "Retention cutoff: ${CUTOFF}"

          echo "$VERSIONS" | jq -r --arg cutoff "$CUTOFF" '
            .[]
            | select(.created_at < $cutoff)
            | [.id, .created_at, ((.metadata.container.tags // []) | join(","))]
            | @tsv
          ' |
          while IFS=$'\t' read -r VERSION_ID CREATED_AT TAGS; do
            echo "Deleting backend package version ${VERSION_ID} (${CREATED_AT}) tags=[${TAGS}]"
            gh api --method DELETE "$API_PATH/$VERSION_ID"
          done

  publish-frontend:
    name: Publish Frontend Image
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-frontend" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

