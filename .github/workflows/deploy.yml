name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Tests
        run: |
          cd backend
          mvn clean test

  build-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          CYPRESS_INSTALL_BINARY=0 npm install --legacy-peer-deps

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # PUBLISH JOBS
  #
  # Both images are built/tested first. The backend and frontend images are
  # then published in parallel using an immutable commit tag only.
  #
  # IMPORTANT: latest/master are NOT updated here. They are promoted only by
  # the release job after BOTH images have been successfully published.
  # This prevents frontend and backend from pointing at different releases.
  # ---------------------------------------------------------------------------

  publish-backend:
    name: Publish Backend Image
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-frontend:
    name: Publish Frontend Image
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-frontend" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # RELEASE / PROMOTION
  #
  # This job runs ONLY when both immutable image-publish jobs succeed.
  # It promotes the same commit-tagged images to latest and master and adds
  # a release-<commit> tag used by the retention policy.
  # ---------------------------------------------------------------------------

  release:
    name: Promote Release
    runs-on: ubuntu-latest
    needs: [ publish-backend, publish-frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    permissions:
      packages: write

    steps:
      - name: Set lowercase image names
        run: |
          echo "BACKEND_IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-frontend" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote backend image
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${BACKEND_IMAGE}:latest" \
            --tag "${BACKEND_IMAGE}:master" \
            --tag "${BACKEND_IMAGE}:release-${GITHUB_SHA}" \
            "${BACKEND_IMAGE}:sha-${GITHUB_SHA}"

      - name: Promote frontend image
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${FRONTEND_IMAGE}:latest" \
            --tag "${FRONTEND_IMAGE}:master" \
            --tag "${FRONTEND_IMAGE}:release-${GITHUB_SHA}" \
            "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}"

      # Keep the 3 newest successful RELEASES, not merely the 3 newest GHCR
      # package versions. This matters because GHCR also stores attestation
      # artifacts and other untagged/package versions.
      - name: Keep only last 3 successful releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_TYPE="${{ github.event.repository.owner.type }}"

          cleanup_package() {
            local COMPONENT="$1"
            local PACKAGE_NAME="$(echo "${REPO}-${COMPONENT}" | tr '[:upper:]' '[:lower:]')"

            if [ "$OWNER_TYPE" = "Organization" ]; then
              local API_PATH="/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
            else
              local API_PATH="/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions"
            fi

            echo "============================================================"
            echo "Cleaning ${COMPONENT} package: ${PACKAGE_NAME}"
            echo "============================================================"

            local VERSIONS
            VERSIONS="$(gh api --paginate "$API_PATH?per_page=100" | jq -s 'add')"

            # Count only explicit release-* tags as successful releases.
            # Ignore buildcache, latest, master, sha-* and untagged artifacts.
            local RELEASES
            RELEASES="$(echo "$VERSIONS" | jq -c '
              map(
                select(
                  any(
                    (.metadata.container.tags // [])[];
                    startswith("release-")
                  )
                )
              )
              | sort_by(.created_at)
              | reverse
            ')"

            local RELEASE_COUNT
            RELEASE_COUNT="$(echo "$RELEASES" | jq 'length')"

            echo "Successful ${COMPONENT} releases found: ${RELEASE_COUNT}"

            if [ "$RELEASE_COUNT" -le 3 ]; then
              echo "Nothing to delete."
              return 0
            fi

            local CUTOFF
            CUTOFF="$(echo "$RELEASES" | jq -r '.[2].created_at')"

            echo "Keeping the 3 newest successful ${COMPONENT} releases."
            echo "Retention cutoff: ${CUTOFF}"

            echo "$VERSIONS" | jq -r --arg cutoff "$CUTOFF" '
              .[]
              | select(.created_at < $cutoff)
              | select(
                  any(
                    (.metadata.container.tags // [])[];
                    startswith("release-")
                  )
                )
              | [.id, .created_at, ((.metadata.container.tags // []) | join(","))]
              | @tsv
            ' |
            while IFS=$'\t' read -r VERSION_ID CREATED_AT TAGS; do
              echo "Deleting old ${COMPONENT} release version ${VERSION_ID} (${CREATED_AT}) tags=[${TAGS}]"
              gh api --method DELETE "$API_PATH/$VERSION_ID"
            done
          }

          cleanup_package backend
          cleanup_package frontend

          echo "Release cleanup completed."

