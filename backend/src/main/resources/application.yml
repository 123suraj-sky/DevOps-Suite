spring:
  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
  application:
    name: devops-suite-monolith
  datasource:
    url: jdbc:postgresql://localhost:5432/devopssuite
    username: postgres
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope:
              - email
              - profile
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@devopssuite.local}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:your-secret-key-minimum-256-bits}
  expiration: 86400000
  refresh-expiration: 604800000

docker:
  pool-size: ${DOCKER_POOL_SIZE:10}
  timeout: ${DOCKER_TIMEOUT:300000}
  host-temp-dir: ${DOCKER_HOST_TEMP_DIR:}
  sandbox-temp-dir: ${DOCKER_SANDBOX_TEMP_DIR:/tmp/devopssuite-sandbox}
  max-code-size-bytes: ${DOCKER_MAX_CODE_SIZE:65536}
  max-stdin-size-bytes: ${DOCKER_MAX_STDIN_SIZE:16384}

logging:
  level:
    root: INFO
    com.devopssuite.monolith: DEBUG
    org.springframework.security: DEBUG

elasticsearch:
  host: ${ELASTICSEARCH_HOST:localhost}
  port: ${ELASTICSEARCH_PORT:9200}
