services:
  # ── Frontend: React SPA served by Nginx on port 80 ──────────────────────────
  # Builds the Vite production bundle and serves it via Nginx.
  # Nginx also reverse-proxies /api/ and /ws/ to the backend container.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devopssuite-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Spring Boot Monolith Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devopssuite-backend
    user: root
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devopssuite
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT}
      # Docker daemon socket host
      DOCKER_HOST: unix:///var/run/docker.sock
      # Sandbox: in-container path where source files are written
      DOCKER_SANDBOX_TEMP_DIR: /tmp/devopssuite-sandbox
      # Sandbox: host-visible path the Docker daemon uses for bind mounts (DinD).
      # Must be the absolute host path that corresponds to ./sandbox-temp.
      # On Linux: set to the absolute path of this directory on the host, e.g. /home/user/DevOps Suite/sandbox-temp
      # On Windows (Docker Desktop): use the Windows path, e.g. C:\Users\you\DevOps Suite\sandbox-temp
      DOCKER_HOST_TEMP_DIR: ${DOCKER_HOST_TEMP_DIR:-}
    volumes:
      # Mount Docker socket so the sandbox can spin up ephemeral sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared temp volume for sandbox source files (DinD bind-mount workaround)
      - ./sandbox-temp:/tmp/devopssuite-sandbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: devopssuite-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: devopssuite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: devopssuite-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devopssuite-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: devopssuite-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

  # ELK Stack - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: devopssuite-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: devopssuite-kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
